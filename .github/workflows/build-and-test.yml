name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            framework: net8.0
          - os: ubuntu-latest
            framework: net8.0
          - os: windows-latest
            framework: net472

    runs-on: ${{ matrix.os }}

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: DotNet Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: DotNet Build
        run: dotnet build tests/SixLabors.Fonts.Tests/SixLabors.Fonts.Tests.csproj -c Release -f ${{ matrix.framework }}

      - name: DotNet Test
        run: dotnet test tests/SixLabors.Fonts.Tests/SixLabors.Fonts.Tests.csproj --no-build -c Release -f ${{ matrix.framework }}

  pack:
    needs: [build]
    runs-on: windows-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: DotNet Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Packages are published to nuget.org manually; CI only builds them for download.
      - name: DotNet Pack
        run: dotnet pack src/SixLabors.Fonts/SixLabors.Fonts.csproj -c Release -o artifacts/nupkg

      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg
